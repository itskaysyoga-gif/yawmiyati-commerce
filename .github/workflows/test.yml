# Builds both local stores from pinned versions and runs the order-flow tests.
# First green run: 28 Oct 2026 (run 40732884990).
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stores:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, intl, gd, exif
          tools: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: MariaDB 10.11 (same server the local stores use)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mariadb-server mariadb-client
          sudo systemctl stop mariadb || true
      - name: Install WordPress, WooCommerce and both stores
        run: dev/setup.sh
      - name: Start stores
        run: dev/serve.sh && sleep 2 && for p in 8081 8082 8083 8084 8085; do curl -fsS -o /dev/null http://localhost:$p/; done
      - name: Integration checks
        run: |
          for cc in eg iq sa ae om; do dev/wp.sh $cc eval-file "$PWD/tests/integration/run.php"; done
      - name: Playwright
        run: |
          npm ci --no-audit --no-fund   # exact versions and integrity hashes from package-lock.json
          npx playwright install --with-deps chromium webkit
      - name: End-to-end order flow
        run: |
          set -o pipefail
          npm test 2>&1 | tee e2e.log
      - name: Report failing tests as annotations
        if: failure()
        run: |
          # Each failing test becomes one annotation with its error block (readable through the checks API).
          node -e '
            const lines = require("fs").readFileSync("e2e.log", "utf8").split("\n");
            for (let i = 0; i < lines.length; i++) {
              if (!/^not ok/.test(lines[i])) continue;
              const block = [];
              for (let j = i + 1; j < lines.length && !/^  \.\.\./.test(lines[j]) && block.length < 25; j++) block.push(lines[j].trim());
              const msg = block.filter((l) => !/^(duration_ms|type|location|failureType|code|---)/.test(l)).join(" | ").replace(/%/g, "%25").replace(/\r?\n/g, " ");
              console.log(`::error title=${lines[i].slice(0, 120)}::${msg.slice(0, 1500)}`);
            }'
          grep -E "^# (pass|fail|skipped)" e2e.log | sed 's/^/::notice::/'
