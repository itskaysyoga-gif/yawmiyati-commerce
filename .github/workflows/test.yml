# Builds both local stores from pinned versions and runs the order-flow tests.
# First green run: 28 Oct 2026 (run 40732884990).
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stores:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, intl, gd, exif
          tools: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: MariaDB 10.11 (same server the local stores use)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mariadb-server mariadb-client
          sudo systemctl stop mariadb || true
      - name: Install WordPress, WooCommerce and both stores
        run: dev/setup.sh
      - name: Start stores
        run: dev/serve.sh && sleep 2 && curl -fsS -o /dev/null http://localhost:8081/ && curl -fsS -o /dev/null http://localhost:8082/
      - name: Integration checks
        run: |
          dev/wp.sh eg eval-file "$PWD/tests/integration/run.php"
          dev/wp.sh iq eval-file "$PWD/tests/integration/run.php"
      - name: Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: End-to-end order flow
        run: |
          set -o pipefail
          npm test 2>&1 | tee e2e.log
      - name: Report failing tests as annotations
        if: failure()
        run: |
          # Each failing test becomes an annotation (readable through the checks API without log access).
          awk '/^not ok/{name=$0; getline; n=0} /error:|expected:|actual:|elapsed/{ if (name!="" && n<4) { printf "::error title=%s::%s\n", substr(name,1,120), substr($0,1,300); n++ } }' e2e.log | head -40
          grep -E "^# (pass|fail|skipped)" e2e.log | sed 's/^/::notice::/'
      - name: Store logs on failure
        if: failure()
        run: tail -n 200 dev/.cache/serve-*.log dev/sites/*/wp-content/debug.log 2>/dev/null || true
